# Zeabur 部署配置
# Sandhill production only runs the Node.js application.
# Legacy GPS-TASK/RAG embedding services are intentionally not part of the
# active deployment path. See docs/LEGACY_GPS_TASK_AUDIT.md before restoring
# any archived service.

services:
  # 主 Node.js Express 應用
  sandhill-app:
    type: docker
    source:
      git:
        repo: joe210393/sandhill
        branch: main
    ports:
      - port: 3001
        protocol: http
    env:
      NODE_ENV: production
      PORT: "3001"
      DATABASE_URL: ${MYSQL_URI}
      MYSQL_HOST: ${MYSQL_HOST}
      MYSQL_PORT: ${MYSQL_PORT}
      MYSQL_USERNAME: ${MYSQL_USERNAME}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      # AI (OpenAI-compatible). Configure these in Zeabur environment variables.
      AI_API_URL: https://tactually-venerable-inez.ngrok-free.de/v1
      AI_API_KEY: ${AI_API_KEY}
      AI_MODEL: google/gemma-3-27b
